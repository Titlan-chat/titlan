[package]
name = "tezca-android-trust"
description = "Android-only JNI seam that hands rustls-platform-verifier the application Context (5d-3). Linked into the tezca-core cdylib; contains no unsafe block."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
rustls-platform-verifier = { workspace = true }

# Not `workspace = true`: this crate is the ONE place the workspace's
# unsafe_code = "deny" is relaxed, and only for the `#[unsafe(no_mangle)]`
# attribute the JNI ABI requires (edition 2024 classifies it as unsafe).
# Everything else mirrors the workspace table. Pinned by
# scripts/check-invariants.sh family 18f (exactly one such allowance; no
# unsafe block/fn/impl anywhere in-source).
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Mirrors the workspace table's two justified allows (not new allowances).
needless_pass_by_value = "allow"
too_many_lines = "allow"
